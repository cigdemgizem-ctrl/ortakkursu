name: Siteyi derle ve yayımla

# Her gönderimde, her gün sabah ve her pazar akşamı siteyi Substack'ten
# güncel verilerle yeniden derleyip GitHub Pages'te yayımlar.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * *'    # her gün 07:17 (Türkiye saati)
    - cron: '47 17 * * 0'   # her pazar 20:47 (Türkiye saati), bülten sonrası
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  derle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node build.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  yayimla:
    needs: derle
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
